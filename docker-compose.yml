services:
  migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-betting}
      POSTGRES_USER: ${POSTGRES_USER:-betting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betting}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betting} -d ${POSTGRES_DB:-betting}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
